name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Make Gradle Executable
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        else
          echo "gradlew file missing, generating wrapper..."
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app
        path: "**/build/outputs/apk/debug/*.apk"
